<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Owlko</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22303F;--steel:#6E8CA0;--linen:#F4F4F1;--cta:#F2A93B;--good:#3E7C4F;--display:'Bricolage Grotesque',sans-serif;--body:'Karla',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--linen);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;max-width:480px;width:100%;border-radius:18px;padding:44px 34px;text-align:center;border:1px solid #e3e3dd}
.check{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
h1{font-family:var(--display);font-size:26px;margin-bottom:10px}
p{color:#5a6a78;font-size:15px;margin-bottom:8px;line-height:1.6}
.ref{display:inline-block;background:var(--linen);border-radius:8px;padding:8px 16px;font-family:var(--display);font-weight:700;margin:16px 0;font-size:14px;letter-spacing:.03em}
.btn{display:inline-block;margin-top:18px;background:var(--cta);color:var(--ink);font-family:var(--display);font-weight:700;padding:14px 28px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1 id="greeting">Thank you for your order!</h1>
  <p>A confirmation is on its way to your email. We're preparing your Owlko hangers for shipment &mdash; tracking follows within 24 hours.</p>
  <div class="ref" id="orderref">Order #KH-000000</div>
  <p>Questions about your order? Email <b>support@owlko.com</b> anytime.</p>
  <a class="btn" href="index.html">&larr; Continue shopping</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var name = params.get('name');
if (name) document.getElementById('greeting').textContent = 'Thank you, ' + name + '!';
document.getElementById('orderref').textContent = 'Order #KH-' + Math.floor(100000 + Math.random()*900000);
</script>
</body>
</html>
